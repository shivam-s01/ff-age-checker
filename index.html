<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Account Age Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --fg: #fff;
    --dim: rgba(255,255,255,.55);
    --line: rgba(255,255,255,.16);
    --ease: cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #000; }
  body {
    min-height: 100svh; display: flex; flex-direction: column; color: var(--fg); overflow-x: hidden;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 300; -webkit-font-smoothing: antialiased;
  }

  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: max(40px, env(safe-area-inset-top)) 24px 32px;
  }
  body.has-result main { align-items: flex-start; padding-top: max(48px, env(safe-area-inset-top)); }
  .wrap { width: 100%; max-width: 460px; }
  body.has-result .wrap { max-width: 520px; }

  .eyebrow { font-size: 11px; font-weight: 400; letter-spacing: .3em; text-transform: uppercase; color: var(--dim); margin-bottom: 26px; }

  h1 { font-weight: 200; font-size: clamp(38px, 10.5vw, 58px); line-height: 1.04; letter-spacing: -.04em; }
  h1 .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; }
  h1 .w > span { display: inline-block; transform: translateY(110%); animation: rise 1.1s var(--ease) forwards; animation-delay: calc(var(--i) * 80ms + 100ms); }
  h1 b { font-weight: 500; }
  @keyframes rise { to { transform: none; } }

  .lead { margin-top: 22px; color: var(--dim); font-size: 15px; line-height: 1.65; max-width: 38ch; }

  .fade { opacity: 0; transform: translateY(12px); animation: fadeUp 1s var(--ease) forwards; animation-delay: calc(var(--d, 0) * 1ms); }
  @keyframes fadeUp { to { opacity: 1; transform: none; } }

  /* ---------- form ---------- */
  form { margin-top: 44px; }
  .field { position: relative; }
  .field input {
    width: 100%; background: transparent; border: 0; outline: 0; color: var(--fg); caret-color: #fff;
    font: inherit; font-weight: 200; font-size: 30px; letter-spacing: .04em;
    padding: 8px 0 14px; font-variant-numeric: tabular-nums; border-radius: 0;
  }
  .field input::placeholder { color: rgba(255,255,255,.2); }
  .field .base, .field .glow { position: absolute; left: 0; bottom: 0; height: 1px; width: 100%; }
  .field .base { background: var(--line); }
  .field .glow { background: #fff; transform: scaleX(0); transform-origin: left; transition: transform .8s var(--ease); }
  .field:focus-within .glow { transform: scaleX(1); }
  .field label { position: absolute; right: 0; top: 18px; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); pointer-events: none; transition: opacity .4s; }
  .field:focus-within label, .field.filled label { opacity: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
  .chip {
    font: inherit; font-size: 12px; font-weight: 400; letter-spacing: .14em; color: var(--dim);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 16px; cursor: pointer; transition: all .45s var(--ease);
  }
  .chip:hover { color: #fff; border-color: rgba(255,255,255,.5); }
  .chip[aria-pressed="true"] { background: #fff; color: #000; border-color: #fff; }

  .btn {
    position: relative; isolation: isolate; overflow: hidden; width: 100%; margin-top: 34px;
    display: flex; align-items: center; justify-content: space-between;
    font: inherit; font-size: 13px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
    color: #000; background: #fff; border: 1px solid #fff; border-radius: 999px;
    padding: 20px 26px; cursor: pointer; transition: color .6s var(--ease), transform .6s var(--ease);
  }
  .btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #000; transform: translateY(101%); transition: transform .7s var(--ease); }
  .btn:hover { color: #fff; }
  .btn:hover::before { transform: none; }
  .btn:active { transform: scale(.985); }
  .btn svg { width: 18px; height: 18px; transition: transform .6s var(--ease); }
  .btn:hover svg { transform: translateX(6px); }
  .btn[disabled] { pointer-events: none; }
  .btn .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: #000; opacity: 0; transform: scaleX(0); transform-origin: left; }
  .btn.loading .bar { opacity: 1; animation: load 1.4s var(--ease) infinite; }
  @keyframes load {
    0% { transform: scaleX(0); transform-origin: left; }
    50% { transform: scaleX(1); transform-origin: left; }
    51% { transform: scaleX(1); transform-origin: right; }
    100% { transform: scaleX(0); transform-origin: right; }
  }

  .error { min-height: 22px; margin-top: 18px; font-size: 13px; color: var(--dim); }
  .error.show { color: #fff; animation: shake .5s var(--ease); }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

  /* ---------- profile ---------- */
  #result { display: none; }
  body.has-result #intro { display: none; }
  body.has-result #result { display: block; }

  .back {
    position: relative; padding: 6px 0; background: none; border: 0; cursor: pointer;
    font: inherit; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); transition: color .4s;
  }
  .back::after { content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .6s var(--ease); }
  .back:hover { color: #fff; }
  .back:hover::after { transform: scaleX(1); }

  .head { display: flex; align-items: center; gap: 22px; margin-top: 34px; }
  .avatar {
    flex: none; width: 92px; height: 92px; border-radius: 50%; overflow: hidden; position: relative;
    border: 1px solid rgba(255,255,255,.4); display: grid; place-items: center;
    font-size: 40px; font-weight: 200; letter-spacing: 0; text-transform: uppercase;
  }
  .avatar::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; border: 1px solid var(--line); pointer-events: none; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
  .who { min-width: 0; }
  .who h2 { font-weight: 300; font-size: clamp(26px, 7.5vw, 34px); line-height: 1.1; letter-spacing: -.03em; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; font-size: 12px; letter-spacing: .14em; color: var(--dim); font-variant-numeric: tabular-nums; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 11px; font-weight: 400; letter-spacing: .16em; color: #fff; }
  .bio { margin-top: 26px; padding-left: 16px; border-left: 1px solid rgba(255,255,255,.4); color: var(--dim); font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; }

  .sec { margin-top: 44px; }
  .sec-label { font-size: 11px; font-weight: 400; letter-spacing: .3em; text-transform: uppercase; color: var(--dim); }

  .counters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
  .ctr { border-top: 1px solid var(--line); padding-top: 14px; }
  .ctr b { display: block; font-weight: 200; font-size: clamp(46px, 14vw, 72px); line-height: 1; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
  .ctr span { display: block; margin-top: 10px; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; margin-top: 14px; }
  .stat { border-top: 1px solid var(--line); padding: 16px 0 20px; }
  .stat b { display: block; font-weight: 200; font-size: 30px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .stat span { display: block; margin-top: 10px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }

  .details { margin-top: 14px; }
  .det { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 16px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .det:last-child { border-bottom: 1px solid var(--line); }
  .det span:first-child { flex: none; color: var(--dim); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; }
  .det span:last-child { font-weight: 400; font-variant-numeric: tabular-nums; text-align: right; overflow-wrap: anywhere; }

  footer { padding: 8px 24px max(20px, env(safe-area-inset-bottom)); text-align: center; font-size: 11px; letter-spacing: .06em; color: rgba(255,255,255,.3); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>

<main>
  <div class="wrap">

    <section id="intro">
      <div class="eyebrow fade" style="--d:0">Free Fire &nbsp;·&nbsp; Account Age</div>
      <h1 aria-label="How old is your account?">
        <span class="w"><span style="--i:0">How</span></span>
        <span class="w"><span style="--i:1">old</span></span>
        <span class="w"><span style="--i:2">is</span></span>
        <span class="w"><span style="--i:3">your</span></span>
        <span class="w"><span style="--i:4"><b>account?</b></span></span>
      </h1>
      <p class="lead fade" style="--d:700">Enter your Free Fire UID to see your full profile and exactly how long your account has existed.</p>

      <form id="form" autocomplete="off" novalidate>
        <div class="field fade" style="--d:850" id="field">
          <input id="uid" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="0000000000" aria-label="Player UID">
          <label for="uid">UID</label>
          <div class="base"></div><div class="glow"></div>
        </div>

        <div class="chips fade" style="--d:1000" role="group" aria-label="Region">
          <button type="button" class="chip" data-r="IND" aria-pressed="true">IND</button>
          <button type="button" class="chip" data-r="BR" aria-pressed="false">BR</button>
          <button type="button" class="chip" data-r="ID" aria-pressed="false">ID</button>
          <button type="button" class="chip" data-r="SG" aria-pressed="false">SG</button>
          <button type="button" class="chip" data-r="ME" aria-pressed="false">ME</button>
          <button type="button" class="chip" data-r="BD" aria-pressed="false">BD</button>
          <button type="button" class="chip" data-r="PK" aria-pressed="false">PK</button>
        </div>

        <button class="btn fade" style="--d:1150" id="go" type="submit">
          <span id="goText">View profile</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <i class="bar"></i>
        </button>
        <div class="error" id="error" role="alert"></div>
      </form>
    </section>

    <section id="result" aria-live="polite">
      <button class="back fade" style="--d:0" id="again" type="button">&larr; New search</button>

      <div class="head fade" style="--d:120">
        <div class="avatar" id="avatar"></div>
        <div class="who">
          <h2 id="pName"></h2>
          <div class="meta" id="pMeta"></div>
        </div>
      </div>
      <p class="bio fade" style="--d:240" id="pBio" hidden></p>

      <div class="sec">
        <div class="sec-label fade" style="--d:320">Account age</div>
        <div class="counters">
          <div class="ctr fade" style="--d:400"><b>0</b><span>Years</span></div>
          <div class="ctr fade" style="--d:500"><b>0</b><span>Months</span></div>
          <div class="ctr fade" style="--d:600"><b>0</b><span>Days</span></div>
        </div>
      </div>

      <div class="sec" id="statsSec">
        <div class="sec-label fade" style="--d:700">Statistics</div>
        <div class="stats" id="stats"></div>
      </div>

      <div class="sec" id="detSec">
        <div class="sec-label fade" style="--d:800">Details</div>
        <div class="details" id="details"></div>
      </div>
    </section>

  </div>
</main>

<footer>Unofficial tool. Not affiliated with Garena.</footer>

<script>
  // Paste your deployed Worker URL here
  const WORKER_URL = "https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev";

  const $ = (s) => document.querySelector(s);
  const uid = $("#uid"), field = $("#field"), err = $("#error");
  const btn = $("#go"), btnText = $("#goText");
  let region = "IND";

  uid.addEventListener("input", () => {
    uid.value = uid.value.replace(/\D/g, "");
    field.classList.toggle("filled", !!uid.value);
    err.textContent = ""; err.classList.remove("show");
  });

  document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
    region = c.dataset.r;
    document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === c)));
  }));

  const showError = (msg) => {
    err.textContent = msg;
    err.classList.remove("show"); void err.offsetWidth; err.classList.add("show");
  };

  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const has = (v) => v !== null && v !== undefined && v !== "";
  const fmtDate = (ms) => new Date(ms).toLocaleDateString("en-US", { day: "numeric", month: "long", year: "numeric" });

  function diff(fromMs) {
    const a = new Date(fromMs), b = new Date();
    let y = b.getFullYear() - a.getFullYear();
    let m = b.getMonth() - a.getMonth();
    let d = b.getDate() - a.getDate();
    if (d < 0) { m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
    if (m < 0) { y--; m += 12; }
    return { y: Math.max(y, 0), m, d };
  }

  function countUp(node, to, delay, fmt = (n) => String(n)) {
    const dur = 1500 + Math.min(to, 400) * 3;
    const start = performance.now() + delay;
    const ease = (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t));
    node.textContent = fmt(0);
    (function tick(now) {
      const t = Math.min(Math.max((now - start) / dur, 0), 1);
      node.textContent = fmt(Math.round(to * ease(t)));
      if (t < 1) requestAnimationFrame(tick);
    })(performance.now());
  }

  function restartFades(scope) {
    document.querySelectorAll(scope + " .fade").forEach((n) => { n.style.animation = "none"; void n.offsetWidth; n.style.animation = ""; });
  }

  const STATS = [
    ["Level", "level"], ["Experience", "exp"], ["Likes", "likes"], ["Honor score", "honor"],
    ["BR rank points", "brPoints"], ["CS rank points", "csPoints"], ["Badges", "badges"],
  ];

  function render(data) {
    // header
    const name = has(data.nickname) ? String(data.nickname) : "Player " + data.uid;
    $("#pName").textContent = name;

    const av = $("#avatar");
    av.textContent = "";
    av.append(document.createTextNode(name.trim().charAt(0) || "?"));
    if (data.avatar) {
      const img = new Image();
      img.alt = ""; img.referrerPolicy = "no-referrer";
      img.onload = () => { av.textContent = ""; av.append(img); };
      img.src = data.avatar;
    }

    const meta = $("#pMeta");
    meta.textContent = "";
    meta.append(el("span", null, "UID " + data.uid));
    meta.append(el("span", "tag", data.region || region));
    if (has(data.title)) meta.append(el("span", null, data.title));

    const bio = $("#pBio");
    bio.hidden = !has(data.bio);
    bio.textContent = has(data.bio) ? data.bio : "";

    // statistics (only the ones the API returned)
    const stats = $("#stats"); stats.textContent = "";
    const numeric = [];
    STATS.forEach(([label, key]) => {
      if (!has(data[key])) return;
      const cell = el("div", "stat fade");
      cell.style.setProperty("--d", 760 + stats.children.length * 80);
      const b = el("b", null, Number(data[key]).toLocaleString("en-US"));
      cell.append(b, el("span", null, label));
      stats.append(cell);
      numeric.push([b, Number(data[key])]);
    });
    $("#statsSec").hidden = !stats.children.length;

    // details
    const det = $("#details"); det.textContent = "";
    const rows = [];
    if (data.createdAt) rows.push(["Account created", fmtDate(data.createdAt)]);
    if (data.lastLogin) rows.push(["Last login", fmtDate(data.lastLogin)]);
    if (has(data.guild)) rows.push(["Guild", data.guild]);
    if (has(data.title)) rows.push(["Title", data.title]);
    rows.push(["Region", data.region || region], ["Player ID", data.uid]);
    rows.forEach(([k, v], i) => {
      const r = el("div", "det fade");
      r.style.setProperty("--d", 860 + i * 90);
      r.append(el("span", null, k), el("span", null, v));
      det.append(r);
    });

    document.body.classList.add("has-result");
    restartFades("#result");

    // account age counters
    const ctrs = document.querySelectorAll(".ctr b");
    if (data.createdAt) {
      const { y, m, d } = diff(data.createdAt);
      [y, m, d].forEach((n, i) => countUp(ctrs[i], n, 500 + i * 120));
    } else {
      ctrs.forEach((c) => (c.textContent = "—"));
    }
    numeric.forEach(([node, n], i) => countUp(node, n, 850 + i * 80, (v) => v.toLocaleString("en-US")));
    scrollTo({ top: 0 });
  }

  $("#form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = uid.value.trim();
    if (!/^\d{6,12}$/.test(id)) { showError("Enter a valid UID (6 to 12 digits)."); return; }

    btn.disabled = true; btn.classList.add("loading"); btnText.textContent = "Loading";
    err.textContent = "";
    try {
      let data;
      if (new URLSearchParams(location.search).has("demo")) {
        await new Promise((r) => setTimeout(r, 1200));
        data = {
          uid: id, nickname: "Shadow Striker", region, level: 67, exp: 1284560, likes: 48213, honor: 100,
          brPoints: 4120, csPoints: 3560, badges: 38, title: "Conqueror", guild: "Night Owls",
          bio: "Play hard. Stay humble. Booyah.",
          createdAt: Date.now() - 1000 * 60 * 60 * 24 * 1130, lastLogin: Date.now() - 1000 * 60 * 60 * 5,
        };
      } else {
        const res = await fetch(`${WORKER_URL}?uid=${encodeURIComponent(id)}&region=${encodeURIComponent(region)}`);
        data = await res.json();
        if (!res.ok) throw new Error(data.error || "Something went wrong.");
      }
      render(data);
    } catch (ex) {
      showError(ex.message || "Network error. Please try again.");
    } finally {
      btn.disabled = false; btn.classList.remove("loading"); btnText.textContent = "View profile";
    }
  });

  $("#again").addEventListener("click", () => {
    document.body.classList.remove("has-result");
    uid.value = ""; field.classList.remove("filled");
    restartFades("#intro");
    uid.focus({ preventScroll: true });
  });
</script>
</body>
</html>
