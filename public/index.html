<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f4f7" media="(prefers-color-scheme: light)">
<title>FF Profile & Account Age Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark light;--rgb:255 255 255;--bg:#000;--fg:#fff;--dim:rgb(var(--rgb)/.55);--line:rgb(var(--rgb)/.14);--av:#0a0a0a;--btn-bg:#fff;--btn-fg:#000;--er:#ff6b6b;--orb:.28;--c1:rgb(255 255 255/.08);--c2:rgb(255 255 255/.02);--glow:rgb(255 255 255/.12);--sh:none}
@media(prefers-color-scheme:light){:root{--rgb:17 17 20;--bg:#f4f4f7;--fg:#111114;--av:#fff;--btn-bg:#111114;--btn-fg:#fff;--er:#d93025;--orb:.2;--c1:rgb(255 255 255/.85);--c2:rgb(255 255 255/.5);--glow:rgb(255 255 255/.9);--sh:0 20px 60px -25px rgb(30 30 60/.3)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{min-height:100svh;display:flex;flex-direction:column;color:var(--fg);overflow-x:hidden;font-family:Inter,system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:var(--orb);animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--a);left:-30vmax;top:-30vmax}
.bg i:nth-child(2){background:var(--c);right:-35vmax;top:20vh;animation-delay:-7s}
.bg i:nth-child(3){background:var(--b);left:-10vmax;bottom:-40vmax;animation-delay:-14s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(transparent 30%,var(--bg) 95%)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:max(40px,env(safe-area-inset-top)) 22px 28px}
body.res main{align-items:flex-start}
.wrap{width:100%;max-width:480px}
.eyebrow{font-size:11px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:24px}
h1{font-weight:200;font-size:clamp(38px,10.5vw,58px);line-height:1.04;letter-spacing:-.04em}
h1 b{font-weight:600;background:linear-gradient(90deg,var(--fg),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em}
h1 .w>span{display:inline-block;transform:translateY(110%);animation:rise 1.1s var(--ease) forwards;animation-delay:calc(var(--i)*80ms + 100ms)}
@keyframes rise{to{transform:none}}
.lead{margin-top:20px;color:var(--dim);font-size:15px;line-height:1.65;max-width:38ch}
.fade{opacity:0;transform:translateY(14px);animation:up 1s var(--ease) forwards;animation-delay:calc(var(--d,0)*1ms)}
@keyframes up{to{opacity:1;transform:none}}
form{margin-top:40px}
.field{position:relative}
.field input{width:100%;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;font-weight:200;font-size:30px;letter-spacing:.04em;padding:8px 0 14px;font-variant-numeric:tabular-nums;border-radius:0}
.field input::placeholder{color:rgb(var(--rgb)/.2)}
.field u{position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--line);text-decoration:none}
.field u:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--a),var(--c));transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease)}
.field:focus-within u:after{transform:scaleX(1)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:22px;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:12px;letter-spacing:.14em;color:var(--dim);background:rgb(var(--rgb)/.04);border:1px solid var(--line);border-radius:99px;padding:9px 15px;cursor:pointer;transition:.4s var(--ease)}
.chip[aria-pressed=true]{color:var(--btn-fg);background:var(--btn-bg);border-color:var(--btn-bg)}
.go{margin-top:28px;width:100%;font:inherit;font-weight:500;font-size:15px;letter-spacing:.06em;color:var(--btn-fg);background:var(--btn-bg);border:0;border-radius:16px;padding:18px;cursor:pointer;position:relative;overflow:hidden;transition:transform .5s var(--ease)}
.go:active{transform:scale(.98)}
.go.loading:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,122,24,.5),transparent 70%);animation:sh 1s linear infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.err{min-height:20px;margin-top:14px;font-size:13px;color:var(--er)}
#result{display:none}
body.res #result{display:block}
body.res #intro{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.link{font:inherit;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);background:none;border:0;cursor:pointer}
.card{position:relative;border:1px solid var(--line);border-radius:28px;padding:22px;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:var(--sh);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transform-style:preserve-3d;transition:transform .3s}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),var(--glow),transparent 60%);pointer-events:none}
.head{display:flex;gap:18px;align-items:center}
.av{flex:none;width:92px;height:92px;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,var(--a),var(--c),var(--b),var(--a));animation:spin 8s linear infinite;position:relative}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.av>div{width:100%;height:100%;border-radius:50%;background:var(--av);display:grid;place-items:center;font-size:36px;font-weight:200;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.dot{position:absolute;right:4px;bottom:4px;width:16px;height:16px;border-radius:50%;background:#555;border:3px solid var(--av)}
.dot.on{background:#2ee66b;box-shadow:0 0 0 0 #2ee66b;animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}}
.nm{font-size:25px;font-weight:500;letter-spacing:-.02em;line-height:1.15;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:11px;letter-spacing:.14em;color:var(--dim)}
.tag{border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--fg)}
.bio{margin-top:18px;padding-left:14px;border-left:1px solid var(--line);color:var(--dim);font-size:15px;line-height:1.5}
.sec{margin-top:36px}
.lab{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:16px}
.ages{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ctr{border-top:1px solid var(--line);padding-top:14px}
.ctr b{display:block;font-weight:200;font-size:clamp(46px,14vw,64px);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,var(--fg),rgb(var(--rgb)/.6));-webkit-background-clip:text;background-clip:text;color:transparent}
.ctr span{display:block;margin-top:10px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.pill{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:8px 14px;background:rgb(var(--rgb)/.03)}
.pill b{color:var(--fg);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.stat{border-top:1px solid var(--line);padding:16px 0 18px}
.stat b{display:block;font-weight:200;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:6px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.bar{height:2px;margin-top:12px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--c));transition:width 1.8s var(--ease)}
.det{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding:15px 0;font-size:14px}
.det span:first-child{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);padding-top:2px}
.det span:last-child{text-align:right;word-break:break-word}
details{margin-top:30px;border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:16px 0;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
summary::-webkit-details-marker{display:none}
.acts{display:flex;gap:10px;margin-top:34px;flex-wrap:wrap}
.btn{flex:1;min-width:150px;font:inherit;font-weight:500;font-size:14px;color:var(--btn-fg);background:var(--btn-bg);border:0;border-radius:16px;padding:16px;cursor:pointer;transition:transform .5s var(--ease)}
.btn:active{transform:scale(.97)}
footer{padding:18px 24px calc(18px + env(safe-area-inset-bottom));text-align:center;font-size:11px;letter-spacing:.14em;color:rgb(var(--rgb)/.3)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}


.hdr{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:flex-end;padding:calc(env(safe-area-inset-top) + 18px) 22px 0}
.by{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-size:14px;font-weight:500;letter-spacing:-.01em;opacity:0;animation:byin 1s var(--ease) .3s forwards;transition:transform .5s var(--ease)}
@keyframes byin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.by:active{transform:scale(.96)}
.by i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:radial-gradient(circle at 30% 107%,#fdf497 0,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}
.by svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{padding-top:max(88px,calc(env(safe-area-inset-top) + 76px))!important}
</style>
</head>
<body>
<header class="hdr"><a class="by" href="https://www.instagram.com/shivam_shrma.01" target="_blank" rel="noopener" aria-label="Shivam Sharma on Instagram"><i><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".7" fill="#fff"/></svg></i>Shivam Sharma</a></header>
<div class="bg"><i></i><i></i><i></i></div>
<main><div class="wrap">

<section id="intro">
  <p class="eyebrow fade" style="--d:0">Free Fire · Profile Lookup</p>
  <h1><span class="w" style="--i:0"><span>How</span></span> <span class="w" style="--i:1"><span>old</span></span> <span class="w" style="--i:2"><span>is</span></span><br><span class="w" style="--i:3"><span>your</span></span> <span class="w" style="--i:4"><span><b>account?</b></span></span></h1>
  <p class="lead fade" style="--d:500">Exact age, last login time, avatar, stats and more. Enter any player UID.</p>
  <form id="form" class="fade" style="--d:700" autocomplete="off">
    <div class="field" id="field"><input id="uid" inputmode="numeric" placeholder="Player UID" maxlength="12" aria-label="Player UID"><u></u></div>
    <div class="chips" id="chips"></div>
    <button class="go" id="go" type="submit"><span id="goText">View profile</span></button>
    <p class="err" id="error" role="alert"></p>
  </form>
</section>

<section id="result">
  <div class="top fade" style="--d:0"><button class="link" id="again">← New search</button><button class="link" id="shareTop">Share ↗</button></div>
  <div class="card fade" style="--d:80" id="card">
    <div class="head">
      <div class="av"><div id="avatar"></div><span class="dot" id="dot"></span></div>
      <div><div class="nm" id="pName"></div><div class="meta" id="pMeta"></div></div>
    </div>
    <p class="bio" id="pBio" hidden></p>
  </div>

  <div class="sec fade" style="--d:300">
    <p class="lab">Account age</p>
    <div class="ages"><div class="ctr"><b>0</b><span>Years</span></div><div class="ctr"><b>0</b><span>Months</span></div><div class="ctr"><b>0</b><span>Days</span></div></div>
    <div class="pills" id="pills"></div>
  </div>

  <div class="sec" id="statsSec"><p class="lab fade" style="--d:600">Statistics</p><div class="grid" id="stats"></div></div>
  <div class="sec"><p class="lab fade" style="--d:800">Details</p><div id="details"></div></div>
  <details class="fade" style="--d:1000" id="allData"><summary>All data ＋</summary><div id="extra"></div></details>

  <div class="acts fade" style="--d:1100">
    <button class="btn" id="shareCard">Save screenshot card</button>
  </div>
</section>

</div></main>
<footer>Unofficial tool. Not affiliated with Garena.</footer>

<script>
const API = "/api", IG = "@shivam_shrma.01";
const $ = (s) => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const has = (v) => v !== null && v !== undefined && v !== "";
const nf = (n) => Number(n).toLocaleString("en-US");
const uid = $("#uid"), err = $("#error"), btn = $("#go");
let region = "IND", last = null;

["IND","BD","PK","ID","SG","BR","ME","NA","SAC","TH","VN","EU"].forEach((r, i) => {
  const c = el("button", "chip", r); c.type = "button"; c.setAttribute("aria-pressed", String(!i));
  c.onclick = () => { region = r; document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === c))); };
  $("#chips").append(c);
});
uid.oninput = () => { uid.value = uid.value.replace(/\D/g, ""); err.textContent = ""; };

const dt = (ms) => new Date(ms).toLocaleString("en-US", { day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit" });
const d0 = (ms) => new Date(ms).toLocaleDateString("en-US", { day: "numeric", month: "long", year: "numeric" });
function diff(ms) {
  const a = new Date(ms), b = new Date();
  let y = b.getFullYear() - a.getFullYear(), m = b.getMonth() - a.getMonth(), d = b.getDate() - a.getDate();
  if (d < 0) { m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  return { y: Math.max(y, 0), m, d };
}
function ago(ms) {
  const s = Math.max(0, (Date.now() - ms) / 1000);
  const u = [[31536000, "year"], [2592000, "month"], [86400, "day"], [3600, "hour"], [60, "minute"]];
  for (const [n, w] of u) if (s >= n) { const v = Math.floor(s / n); return v + " " + w + (v > 1 ? "s" : "") + " ago"; }
  return "just now";
}
function countUp(node, to, delay, fmt = String) {
  const dur = 1500 + Math.min(to, 400) * 3, st = performance.now() + delay, ez = (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t));
  node.textContent = fmt(0);
  (function tick(now) { const t = Math.min(Math.max((now - st) / dur, 0), 1); node.textContent = fmt(Math.round(to * ez(t))); if (t < 1) requestAnimationFrame(tick); })(performance.now());
}
const restart = (s) => document.querySelectorAll(s + " .fade").forEach((n) => { n.style.animation = "none"; void n.offsetWidth; n.style.animation = ""; });
const pretty = (k) => k.split(".").pop().replace(/([a-z])([A-Z])/g, "$1 $2").replace(/_/g, " ");

const STATS = [["Level","level",100],["Experience","exp",null],["Likes","likes",null],["Honor score","honor",100],["BR rank points","brPoints",null],["CS rank points","csPoints",null],["Badges","badges",null]];

function render(d) {
  last = d;
  const name = has(d.nickname) ? String(d.nickname) : "Player " + d.uid;
  $("#pName").textContent = name;
  const av = $("#avatar"); av.textContent = name.trim().charAt(0).toUpperCase() || "?";
  if (d.avatar) { const im = new Image(); im.referrerPolicy = "no-referrer"; im.onload = () => { av.textContent = ""; av.append(im); }; im.src = d.avatar; }
  const on = d.lastLogin && Date.now() - d.lastLogin < 15 * 60 * 1000;
  $("#dot").className = "dot" + (on ? " on" : "");
  const meta = $("#pMeta"); meta.textContent = "";
  meta.append(el("span", null, "UID " + d.uid), el("span", "tag", d.region || region));
  if (has(d.title)) meta.append(el("span", null, d.title));
  if (has(d.guild)) meta.append(el("span", null, "◆ " + d.guild));
  $("#pBio").hidden = !has(d.bio); $("#pBio").textContent = d.bio || "";

  const pills = $("#pills"); pills.textContent = "";
  const addPill = (k, v) => { const p = el("span", "pill", k + " "); p.append(el("b", null, v)); pills.append(p); };
  const ctr = document.querySelectorAll(".ctr b");
  if (d.createdAt) {
    const { y, m, d: dd } = diff(d.createdAt);
    [y, m, dd].forEach((n, i) => countUp(ctr[i], n, 500 + i * 120));
    const days = Math.floor((Date.now() - d.createdAt) / 864e5), c = new Date(d.createdAt);
    addPill("Total days", nf(days)); addPill("Born on", c.toLocaleDateString("en-US", { weekday: "long" }));
    const nx = new Date(new Date().getFullYear(), c.getMonth(), c.getDate()); if (nx < new Date()) nx.setFullYear(nx.getFullYear() + 1);
    addPill("Next anniversary", Math.ceil((nx - Date.now()) / 864e5) + " days");
  } else ctr.forEach((c) => (c.textContent = "—"));
  if (d.lastLogin) addPill(on ? "Status" : "Last seen", on ? "Online now" : ago(d.lastLogin));

  const st = $("#stats"); st.textContent = ""; const nums = [];
  STATS.forEach(([l, k, max]) => {
    if (!has(d[k])) return;
    const c = el("div", "stat fade"); c.style.setProperty("--d", 700 + st.children.length * 80);
    const b = el("b", null, "0"); c.append(b, el("span", null, l));
    if (max) { const bar = el("div", "bar"), i = el("i"); bar.append(i); c.append(bar); setTimeout(() => (i.style.width = Math.min(100, d[k] / max * 100) + "%"), 900); }
    st.append(c); nums.push([b, Number(d[k])]);
  });
  $("#statsSec").hidden = !st.children.length;
  nums.forEach(([n, v], i) => countUp(n, v, 850 + i * 80, nf));

  const det = $("#details"); det.textContent = "";
  const rows = [];
  if (d.createdAt) rows.push(["Account created", dt(d.createdAt)]);
  if (d.lastLogin) rows.push(["Last login", dt(d.lastLogin)], ["Last seen", ago(d.lastLogin)]);
  if (has(d.guild)) rows.push(["Guild", d.guild]);
  if (has(d.title)) rows.push(["Title", d.title]);
  if (has(d.avatarId)) rows.push(["Avatar ID", d.avatarId]);
  if (has(d.bannerId)) rows.push(["Banner ID", d.bannerId]);
  rows.push(["Region", d.region || region], ["Player ID", d.uid]);
  rows.forEach(([k, v], i) => { const r = el("div", "det fade"); r.style.setProperty("--d", 850 + i * 80); r.append(el("span", null, k), el("span", null, v)); det.append(r); });

  const ex = $("#extra"); ex.textContent = "";
  Object.entries(d.extra || {}).forEach(([k, v]) => {
    if (/^\d{9,13}$/.test(v) && /time|login|create|date|at$/i.test(k)) v = dt(v.length < 12 ? v * 1000 : Number(v));
    const r = el("div", "det"); r.append(el("span", null, pretty(k)), el("span", null, v)); ex.append(r);
  });
  $("#allData").hidden = !ex.children.length; $("#allData").open = false;

  document.body.classList.add("res"); restart("#result"); scrollTo({ top: 0 });
}

$("#form").onsubmit = async (e) => {
  e.preventDefault();
  const id = uid.value.trim();
  if (!/^\d{6,12}$/.test(id)) { err.textContent = "Enter a valid UID (6 to 12 digits)."; return; }
  btn.disabled = true; btn.classList.add("loading"); $("#goText").textContent = "Loading"; err.textContent = "";
  try {
    const res = await fetch(`${API}?uid=${id}&region=${region}`), data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    render(data);
  } catch (x) { err.textContent = x.message || "Network error. Try again."; }
  finally { btn.disabled = false; btn.classList.remove("loading"); $("#goText").textContent = "View profile"; }
};
$("#again").onclick = () => { document.body.classList.remove("res"); uid.value = ""; restart("#intro"); uid.focus({ preventScroll: true }); };

const card = $("#card");
card.addEventListener("pointermove", (e) => {
  const r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  card.style.setProperty("--mx", x * 100 + "%"); card.style.setProperty("--my", y * 100 + "%");
  card.style.transform = `perspective(900px) rotateY(${(x - .5) * 8}deg) rotateX(${(.5 - y) * 8}deg)`;
});
card.addEventListener("pointerleave", () => (card.style.transform = ""));

// ---------- screenshot card (1080x1350 PNG) ----------
async function makeCard() {
  const d = last, W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"); await document.fonts.load("200 100px Inter"); await document.fonts.load("500 40px Inter");
  const L = matchMedia("(prefers-color-scheme: light)").matches, BG = L ? "#f4f4f7" : "#000", FG = L ? "#111114" : "#fff", RG = L ? "17,17,20" : "255,255,255";
  x.fillStyle = BG; x.fillRect(0, 0, W, H);
